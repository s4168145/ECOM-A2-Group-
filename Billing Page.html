<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Information</title>
    <style>
        .billing-container {
            width: 80%;
            margin: 0 auto;
            border: 1px solid #ddd;
            padding: 20px;
            display: flow-root;
        }
        .billing-layout {
            display: flex;
            gap: 40px;
        }
        .billing-address, .payment-panel {
            flex: 1;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .payment-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
            flex-direction: column
        }
        .payment-option {
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .payment-option img {
            height: 35px;
            vertical-align: middle;
            margin-right: 5px;
        }
        #google-pay-container {
            margin-top: 15px;
            display: none;
        }
        .continue-btn {
            display: inline-block;
            background-color: #2874a6;
            color: white;
            padding: 12px 25px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="billing-container">
    <h1>Provide Billing Information</h1>
    <div class="billing-layout">

        <div class="billing-address">
            <h2>Billing address</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>First name</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Last name</label>
                    <input type="text">
                </div>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="@ Username">
            </div>
            <div class="form-group">
                <label>Email (Optional)</label>
                <input type="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" placeholder="1234 Main St">
            </div>
            <div class="form-group">
                <label>Address 2 (Optional)</label>
                <input type="text" placeholder="Apartment or suite">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Country</label>
                    <select><option>Choose...</option></select>
                </div>
                <div class="form-group">
                    <label>State</label>
                    <select><option>Choose...</option></select>
                </div>
                <div class="form-group">
                    <label>Zip</label>
                    <input type="text">
                </div>
            </div>
        </div>

        <div class="payment-panel">
            <h2>Select A Payment Option</h2>
            <div class="payment-options">
                <label class="payment-option">
                    <input type="radio" name="payment" value="visa">
                    <img src="assets/img/visa.png" alt="Visa">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="mastercard">
                    <img src="assets/img/mastercard.png" alt="MasterCard">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="paypal">
                    <img src="assets/img/paypal.png" alt="PayPal">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="amex">
                    <img src="assets/img/amex.png" alt="Amex">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="alipay">
                    <img src="assets/img/alipay.png" alt="Alipay">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="gpay">
                    <img src="assets/img/googlepay.png" alt="Google Pay">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="applepay">
                    <img src="assets/img/applepay.png" alt="Apple Pay">
                </label>
            </div>

            <div id="google-pay-container"></div>

            <button class="continue-btn">Continue to checkout</button>
        </div>

    </div>
</div>

<script src="googlepay.js"></script>
<script async src="https://pay.google.com/gp/p/js/pay.js" onload="onGooglePayLoaded()"></script>
<script>
document.querySelectorAll('input[name="payment"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
        const gpayContainer = document.getElementById('google-pay-container');
        gpayContainer.style.display = (this.value === 'gpay') ? 'block' : 'none';
    });
});
</script>

</body>
</html>
