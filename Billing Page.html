<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Information</title>
    <style>
        .billing-container {
            width: 80%;
            margin: 0 auto;
            border: 1px solid #ddd;
            padding: 20px;
            display: flow-root;
        }
        .billing-layout {
            display: flex;
            gap: 40px;
        }
        .billing-address, .payment-panel {
            flex: 1;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .payment-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
            flex-direction: column
        }
        .payment-option {
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .payment-option img {
            height: 35px;
            vertical-align: middle;
            margin-right: 5px;
        }
        #google-pay-container {
            margin-top: 15px;
            display: none;
        }
        #visa-payment-form button[type="submit"] {
            background-color: #635bff; /* Stripe's own brand purple */
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        #visa-payment-form button[type="submit"]:hover {
            background-color: #4d44db; /* slightly darker on hover */
    </style>
</head>
<body>

<div class="billing-container">
    <h1>Provide Billing Information</h1>
    <div class="billing-layout">

        <div class="billing-address">
            <h2>Billing address</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>First name</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Last name</label>
                    <input type="text">
                </div>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="@ Username">
            </div>
            <div class="form-group">
                <label>Email (Optional)</label>
                <input type="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" placeholder="1234 Main St">
            </div>
            <div class="form-group">
                <label>Address 2 (Optional)</label>
                <input type="text" placeholder="Apartment or suite">
            </div>
            <div class="form-row">
    <div class="form-row">
    <div class="form-group">
        <label>Country</label>
        <select id="country-select" onchange="updateStates()">
            <option value="">Choose...</option>
            <option value="AU">Australia</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="GB">United Kingdom</option>
            <option value="NZ">New Zealand</option>
            <option value="AT">Austria</option>
            <option value="BE">Belgium</option>
            <option value="BR">Brazil</option>
            <option value="BG">Bulgaria</option>
            <option value="CN">China</option>
            <option value="HR">Croatia</option>
            <option value="CY">Cyprus</option>
            <option value="CZ">Czech Republic</option>
            <option value="DK">Denmark</option>
            <option value="EE">Estonia</option>
            <option value="FI">Finland</option>
            <option value="FR">France</option>
            <option value="DE">Germany</option>
            <option value="GR">Greece</option>
            <option value="HK">Hong Kong</option>
            <option value="HU">Hungary</option>
            <option value="IN">India</option>
            <option value="ID">Indonesia</option>
            <option value="IE">Ireland</option>
            <option value="IL">Israel</option>
            <option value="IT">Italy</option>
            <option value="JP">Japan</option>
            <option value="LV">Latvia</option>
            <option value="LT">Lithuania</option>
            <option value="LU">Luxembourg</option>
            <option value="MY">Malaysia</option>
            <option value="MT">Malta</option>
            <option value="MX">Mexico</option>
            <option value="NL">Netherlands</option>
            <option value="NO">Norway</option>
            <option value="PH">Philippines</option>
            <option value="PL">Poland</option>
            <option value="PT">Portugal</option>
            <option value="RO">Romania</option>
            <option value="SG">Singapore</option>
            <option value="SK">Slovakia</option>
            <option value="SI">Slovenia</option>
            <option value="ZA">South Africa</option>
            <option value="KR">South Korea</option>
            <option value="ES">Spain</option>
            <option value="SE">Sweden</option>
            <option value="CH">Switzerland</option>
            <option value="TW">Taiwan</option>
            <option value="TH">Thailand</option>
            <option value="TR">Turkey</option>
            <option value="AE">United Arab Emirates</option>
            <option value="VN">Vietnam</option>
        </select>
    </div>
    <div class="form-group">
        <label>State</label>
        <select id="state-select">
            <option value="">Choose...</option>
        </select>
    </div>
    <div class="form-group">
        <label>Zip</label>
        <input type="text">
    </div>
</div>
</div>
            
        </div>

        <div class="payment-panel">
            <h2>Select A Payment Option</h2>
            <div class="payment-options">
                <label class="payment-option">
                    <input type="radio" name="payment" value="visa">
                    <img src="assets/img/visa.png" alt="Visa">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="mastercard">
                    <img src="assets/img/mastercard.png" alt="MasterCard">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="paypal">
                    <img src="assets/img/paypal.png" alt="PayPal">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="amex">
                    <img src="assets/img/amex.png" alt="Amex">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="alipay">
                    <img src="assets/img/alipay.png" alt="Alipay">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="gpay">
                    <img src="assets/img/googlepay.png" alt="Google Pay">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="applepay">
                    <img src="assets/img/applepay.png" alt="Apple Pay">
                </label>
            </div>

            <div id="google-pay-container"></div>

            <div id="visa-payment-container" style="display:none; margin-top: 15px;">
                <form id="visa-payment-form">
                    <div id="card-element"></div>
                    <div id="card-errors" role="alert" style="color: #fa755a; margin-top: 8px; font-size: 14px;"></div>
                    <button type="submit" class="continue-btn" style="margin-top: 10px;">Pay with Visa</button>
                </form>
</div>

        </div>

    </div>
</div>

<script src="googlepay.js"></script>
<script async src="https://pay.google.com/gp/p/js/pay.js" onload="onGooglePayLoaded()"></script>
<script>
document.querySelectorAll('input[name="payment"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
        const gpayContainer = document.getElementById('google-pay-container');
        const visaContainer = document.getElementById('visa-payment-container');

        gpayContainer.style.display = (this.value === 'gpay') ? 'block' : 'none';
        visaContainer.style.display = (this.value === 'visa') ? 'block' : 'none';

        if (this.value === 'visa') {
            mountStripeCard();
        }
    });
});
</script>
<script>
const statesByCountry = {
    AU: ["New South Wales", "Victoria", "Queensland", "Western Australia", "South Australia", "Tasmania", "Australian Capital Territory", "Northern Territory"],
    US: ["Alabama", "Alaska", "Arizona", "Arkansas", "California", "Colorado", "Connecticut", "Delaware", "Florida", "Georgia", "Hawaii", "Idaho", "Illinois", "Indiana", "Iowa", "Kansas", "Kentucky", "Louisiana", "Maine", "Maryland", "Massachusetts", "Michigan", "Minnesota", "Mississippi", "Missouri", "Montana", "Nebraska", "Nevada", "New Hampshire", "New Jersey", "New Mexico", "New York", "North Carolina", "North Dakota", "Ohio", "Oklahoma", "Oregon", "Pennsylvania", "Rhode Island", "South Carolina", "South Dakota", "Tennessee", "Texas", "Utah", "Vermont", "Virginia", "Washington", "West Virginia", "Wisconsin", "Wyoming"],
    CA: ["Alberta", "British Columbia", "Manitoba", "New Brunswick", "Newfoundland and Labrador", "Nova Scotia", "Ontario", "Prince Edward Island", "Quebec", "Saskatchewan"]
};

function updateStates() {
    const country = document.getElementById('country-select').value;
    const stateSelect = document.getElementById('state-select');

    stateSelect.innerHTML = '<option value="">Choose...</option>';

    if (statesByCountry[country]) {
        statesByCountry[country].forEach(function(state) {
            const opt = document.createElement('option');
            opt.value = state;
            opt.textContent = state;
            stateSelect.appendChild(opt);
        });
    } else if (country) {
        // Fallback for countries without a full state list — free text
        stateSelect.innerHTML = '<option value="">N/A — enter in address field</option>';
    }
}
</script>
<script src="https://js.stripe.com/v3/"></script>
<script src="stripepay.js"></script>
</body>
</html>
