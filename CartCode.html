<!DOCTYPE html> 
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <!-- CSS styles to handle the layout, grid alignments, and button styling for the cart -->
    <style>
        /* Main box holding the entire shopping cart section */
        .cart-container {
            width: 80%;
            margin: 0 auto;
            border: 5px solid #3f3e3e;
            padding: 20px;
            overflow: hidden;
        }

        /* Flex layout to align items nicely side by side */
        .cart-header,
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Header row formatting for columns (Image, Price, Qty, Total) */
        .cart-header {
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            font-weight: bold; 
        }

        /* Single cart row styling */
        .cart-item {
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        /* Keep bike images small and uniform */
        .cart-item img {
            max-width: 100px;
        }

        .cart-item p {
            margin: 0;
        }

        /* Gives description section more room compared to price/qty columns */
        .cart-item .description {
            flex: 2;
            padding: 0 10px;
        }

        /* Center aligns table content columns */
        .cart-item .price,
        .cart-item .qty,
        .cart-item .total {
            flex: 1;
            text-align: center;
        }

        /* Sizing for quantity input field */
        .cart-item .qty input {
            width: 50px;
            text-align: center;
        }

        /* Black buttons style for update/remove actions */
        .update-btn,
        .remove-btn {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        .payment-section {
            margin-top: 20px;
        }

        /* Layout for payment logos grid */
        .payment-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
            justify-content: space-between;
        }

        .payment-option {
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 4px;
            display: inline-block;
        }

        /* Red checkout button floating on the right side */
        .checkout-btn {
            display: block;
            background-color: #c0392b;
            color: white;
            padding: 15px 20px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            float: right;
        }

        .payment-option img {
            height: 35px;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <div class="cart-container">
        <h1>Shopping Cart</h1>

        <!-- Back to bikes page link -->
        <p><a href="index.html">&lt;&lt; Continue Shopping</a></p>

        <!-- Column titles for the cart page layout -->
        <div class="cart-header">
            <div>Remove</div>
            <div>Image</div>
            <div class="description">Product Description</div>
            <div class="price">Price</div>
            <div class="qty">Qty</div>
            <div class="total">Total</div>
        </div>

        <!-- Dynamic container where JavaScript renders all bikes added to cart -->
        <div id="cart-items-list"></div>

        <!-- Controls for updating quantities, removing items, and grand total -->
        <div style="margin-top: 20px;">
            <button class="update-btn" onclick="renderCart()">UPDATE QTY</button>
            <button class="remove-btn" onclick="removeSelected()">REMOVE</button>
            <span style="float: right; font-size: 20px; font-weight: bold;">
                Cart Total: $<span id="cart-grand-total">0.00</span>
            </span>
        </div>

        <!-- Display section for accepted payment options -->
        <div class="payment-section">
            <h2>Accepted Payment Options</h2>
            <div class="payment-options">
                <div class="payment-option"><img src="assets/img/visa.png" alt="Visa"></div>
                <div class="payment-option"><img src="assets/img/mastercard.png" alt="MasterCard"></div>
                <div class="payment-option"><img src="assets/img/paypal.png" alt="PayPal"></div>
                <div class="payment-option"><img src="assets/img/amex.png" alt="Amex"></div>
                <div class="payment-option"><img src="assets/img/alipay.png" alt="Alipay"></div>
                <div class="payment-option"><img src="assets/img/googlepay.png" alt="Google Pay"></div>
                <div class="payment-option"><img src="assets/img/applepay.png" alt="Apple Pay"></div>
            </div>
            <!-- Link to billing/checkout page -->
            <a href="Billing Page 1.html" class="checkout-btn">CHECKOUT NOW &gt;&gt;&gt;</a>
        </div>
    </div>

    <script>
        // Function to grab items from browser storage and render them on page
        function renderCart() {
            // Get saved items from local storage, or make empty list if none
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let listContainer = document.getElementById('cart-items-list');
            let grandTotal = 0;

            // Message to show if user has no bikes in cart
            if (cart.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; padding: 20px; font-weight:bold;">Your cart is currently empty.</p>';
                document.getElementById('cart-grand-total').innerText = '0.00';
                return;
            }

            let htmlOutput = '';

            // Loop through each saved bike in cart and generate HTML row
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                grandTotal += itemTotal; // Add up total overall price

                // HTML structure for each individual bike item in cart
                htmlOutput += `
        <div class="cart-item">
            <div><input type="checkbox" class="remove-check" data-index="${index}"></div>
            <div><img src="${item.image}" alt="${item.title}"></div>
            <div class="description">
                <p><strong>${item.title}</strong></p>
                <p>${item.specs || ''}</p>
                <p>Availability: <span style="color:green;">Online</span> <span style="color:blue;">Immediate Pick-up</span></p>
            </div>
            <div class="price">$${item.price.toFixed(2)}</div>
            <div class="qty">
                <input type="number" value="${item.qty}" min="1" onchange="updateItemQty(${index}, this.value)">
            </div>
            <div class="total">$${itemTotal.toFixed(2)}</div>
        </div>`;
            });

            // Put dynamic items onto page and update final price tag
            listContainer.innerHTML = htmlOutput;
            document.getElementById('cart-grand-total').innerText = grandTotal.toFixed(2);
        }

        // Function to change quantity when user types a new number
        function updateItemQty(index, newQty) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            // Prevents item quantity from dropping below 1
            cart[index].qty = Math.max(1, parseInt(newQty) || 1);
            // Save updated array back into browser storage and re-render screen
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        // Function to delete checked items from cart
        function removeSelected() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let checkboxes = document.querySelectorAll('.remove-check');

            // Keep items that are NOT checked for removal
            let updatedCart = cart.filter((item, index) => !checkboxes[index].checked);

            // Update storage and refresh display
            localStorage.setItem('cart', JSON.stringify(updatedCart));
            renderCart();
        }

        // Run render function automatically as soon as page finishes loading
        window.onload = renderCart;
    </script>

    <script>
        // Saves final grand total to local storage right before jumping to checkout page
        document.querySelector('.checkout-btn').addEventListener('click', function () {
            const totalValue = document.getElementById('cart-grand-total').innerText;
            localStorage.setItem('cartTotal', totalValue);
        });
    </script>

</body>

</html>
