<!-- Shopping cart code , this code will sync the chart and index code so that when someone
 clicls on the cart icon it will take them to the shopping cart page -->

<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character set and responsive layout configuration -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <!-- Page styling for cart layout, product rows, and controls -->
    <style>
        /* Main wrapper styling for the shopping cart section */
        .cart-container {
            width: 80%;
            margin: 0 auto;
            border: 5px solid #3f3e3e;
            padding: 20px;
            overflow: hidden;
        }

        /* Flexbox structure shared by table headers and individual item rows */
        .cart-header,
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Styling for column headings */
        .cart-header {
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            font-weight: bold;
        }

        /* Styling for each product row */
        .cart-item {
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        /* Product image sizing constraints */
        .cart-item img {
            max-width: 100px;
        }

        /* Default margin reset for paragraphs in item rows */
        .cart-item p {
            margin: 0;
        }

        /* Product details column takes up more horizontal space */
        .cart-item .description {
            flex: 2;
            padding: 0 10px;
        }

        /* Uniform width and alignment for numerical columns */
        .cart-item .price,
        .cart-item .qty,
        .cart-item .total {
            flex: 1;
            text-align: center;
        }

        /* Input field sizing for item quantities */
        .cart-item .qty input {
            width: 50px;
            text-align: center;
        }

        /* Action buttons for updating and removing items */
        .update-btn,
        .remove-btn {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        /* Section wrapper for payment options and checkout action */
        .payment-section {
            margin-top: 20px;
        }

        /* Flexbox grid layout for supported payment logos */
        .payment-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
            justify-content: space-between;
        }

        /* Box container around each individual payment logo */
        .payment-option {
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 4px;
            display: inline-block;
        }

        /* Styling for the main checkout button */
        .checkout-btn {
            display: block;
            background-color: #c0392b;
            color: white;
            padding: 15px 20px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            float: right;
        }

        /* Sizing and alignment for payment badge icons */
        .payment-option img {
            height: 35px;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <!-- Main Container Wrapper -->
    <div class="cart-container">
        <h1>Shopping Cart</h1>

        <!-- Back link to product listing page -->
        <p><a href="index.html">&lt;&lt; Continue Shopping</a></p>

        <!-- Header row defining table column categories -->
        <div class="cart-header">
            <div>Remove</div>
            <div>Image</div>
            <div class="description">Product Description</div>
            <div class="price">Price</div>
            <div class="qty">Qty</div>
            <div class="total">Total</div>
        </div>

        <!-- Target container where JavaScript dynamically injects cart items -->
        <div id="cart-items-list"></div>

        <!-- Action controls for bulk cart management and price total summary -->
        <div style="margin-top: 20px;">
            <button class="update-btn" onclick="renderCart()">UPDATE QTY</button>
            <button class="remove-btn" onclick="removeSelected()">REMOVE</button>
            <span style="float: right; font-size: 20px; font-weight: bold;">
                Cart Total: $<span id="cart-grand-total">0.00</span>
            </span>
        </div>

        <!-- Payment icons display and link to checkout page -->
        <div class="payment-section">
            <h2>Accepted Payment Options</h2>
            <div class="payment-options">
                <div class="payment-option"><img src="assets/img/visa.png" alt="Visa"></div>
                <div class="payment-option"><img src="assets/img/mastercard.png" alt="MasterCard"></div>
                <div class="payment-option"><img src="assets/img/paypal.png" alt="PayPal"></div>
                <div class="payment-option"><img src="assets/img/amex.png" alt="Amex"></div>
                <div class="payment-option"><img src="assets/img/alipay.png" alt="Alipay"></div>
                <div class="payment-option"><img src="assets/img/googlepay.png" alt="Google Pay"></div>
                <div class="payment-option"><img src="assets/img/applepay.png" alt="Apple Pay"></div>
            </div>
            <a href="Billing Page.html" class="checkout-btn">CHECKOUT NOW &gt;&gt;&gt;</a>
        </div>
    </div>

    <!-- JavaScript logic handling local storage dynamic rendering and cart operations -->
    <script>
        // Reads stored cart items from browser localStorage and builds the page HTML
        function renderCart() {
            // Retrieve cart items or fallback to an empty array
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let listContainer = document.getElementById('cart-items-list');
            let grandTotal = 0;

            // Display message and reset total if no products are in localStorage
            if (cart.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; padding: 20px; font-weight:bold;">Your cart is currently empty.</p>';
                document.getElementById('cart-grand-total').innerText = '0.00';
                return;
            }

            let htmlOutput = '';

            // Loop through each product entry in the cart array
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                grandTotal += itemTotal;

                // Build HTML element markup for each individual cart item
                htmlOutput += `
        <div class="cart-item">
            <div><input type="checkbox" class="remove-check" data-index="${index}"></div>
            <div><img src="${item.image}" alt="${item.title}"></div>
            <div class="description">
                <p><strong>${item.title}</strong></p>
                <p>${item.specs || ''}</p>
                <p>Availability: <span style="color:green;">Online</span> <span style="color:blue;">Immediate Pick-up</span></p>
            </div>
            <div class="price">$${item.price.toFixed(2)}</div>
            <div class="qty">
                <input type="number" value="${item.qty}" min="1" onchange="updateItemQty(${index}, this.value)">
            </div>
            <div class="total">$${itemTotal.toFixed(2)}</div>
        </div>`;
            });

            // Insert rendered rows into DOM container and display formatted total price
            listContainer.innerHTML = htmlOutput;
            document.getElementById('cart-grand-total').innerText = grandTotal.toFixed(2);
        }

        // Updates quantity of a specific item when user edits number input
        function updateItemQty(index, newQty) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            // Ensure minimum quantity is always at least 1
            cart[index].qty = Math.max(1, parseInt(newQty) || 1);

            // Save updated state and re-render cart elements
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        // Filters out items whose removal checkbox is selected
        function removeSelected() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let checkboxes = document.querySelectorAll('.remove-check');

            // Keep items only if their corresponding checkbox is un-checked
            let updatedCart = cart.filter((item, index) => !checkboxes[index].checked);

            // Save updated cart back to localStorage and rebuild UI view
            localStorage.setItem('cart', JSON.stringify(updatedCart));
            renderCart();
        }

        // Automatically execute renderCart function when page finishes loading
        window.onload = renderCart;
    </script>

</body>

</html>
